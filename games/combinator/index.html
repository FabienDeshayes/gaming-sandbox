<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Combinator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #12151b;
      overflow: hidden;
    }
    /* The parent has to be the viewport for Phaser.Scale.FIT to size the canvas. */
    #game {
      width: 100%;
      height: 100%;
    }
    #game canvas {
      display: block;
      /* Dragging modules must not scroll or zoom the page on touch. */
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
