<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nouxinha — tile sheet</title>
  <style>
    /* A development page, not part of the game. It draws assets/tiles.png with
       its coordinates on it, so a tile can be found by looking at it rather
       than by counting rows. It is the way *in* to the other three: drawing a
       tile's pixels is draw.html, colouring its zones paint.html, and saying
       which sprite a world draws it as biomes.html.

       The page is drawn in a biome's colour, since that is what the tile will
       be seen in; there is no palette to pick, in here or in the game — a
       world's colour is its biome's (src/data/biomes.js). */
    :root { --bg: #0b1a0b; --fg: #33ff66; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 monospace;
      -webkit-font-smoothing: none;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      position: sticky; top: 0; z-index: 2;
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 30%, transparent);
    }
    .title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    h1 { font-size: 15px; margin: 0; letter-spacing: 2px; }
    a { color: var(--fg); }
    .navlink { opacity: 0.65; text-decoration: none; }
    .navlink:hover { opacity: 1; text-decoration: underline; }
    .controls { display: flex; gap: 18px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    label { opacity: 0.65; }
    select, button, input[type=range] {
      font: inherit; color: var(--fg); background: transparent;
      border: 1px solid color-mix(in srgb, var(--fg) 45%, transparent);
      padding: 6px 10px; cursor: pointer;
      min-height: 34px;
    }
    button:hover, select:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
    button[disabled] { opacity: 0.35; cursor: default; }
    pre {
      margin: 0; padding: 8px; max-height: 180px; overflow: auto;
      border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent);
      background: color-mix(in srgb, var(--fg) 6%, transparent);
      font: 11px/1.45 monospace; white-space: pre;
    }
    /* The readout: what is under the cursor, and what the last click picked. */
    .readout { display: flex; gap: 22px; align-items: center; margin-top: 10px; min-height: 76px; flex-wrap: wrap; }
    .swatch canvas { image-rendering: pixelated; display: block; }
    .swatch { display: flex; gap: 10px; align-items: center; }
    .swatch b { font-size: 20px; letter-spacing: 1px; }
    .swatch .key { opacity: 0.65; font-size: 12px; }
    .paintLinks { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
    .paintLinks a { font-size: 12px; text-decoration: none; }
    .paintLinks a:hover { text-decoration: underline; }
    .dim { opacity: 0.4; }
    main { padding: 16px; overflow-x: auto; }
    #sheet { image-rendering: pixelated; display: block; cursor: crosshair; }
    #claimed {
      padding: 0 16px 40px; display: grid; gap: 4px 22px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    }
    #claimed a { display: flex; gap: 10px; align-items: center; text-decoration: none; padding: 4px 2px; }
    #claimed a:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
    #claimed canvas { image-rendering: pixelated; }
    #claimed .co { margin-left: auto; opacity: 0.6; }
    #claimed .painted { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <h1>NOUXINHA TILE SHEET</h1>
      <a class="navlink" href="draw.html">draw a tile's pixels →</a>
      <a class="navlink" href="paint.html">paint a tile's zones →</a>
      <a class="navlink" href="biomes.html">assign tiles to biomes →</a>
    </div>
    <div class="controls">
      <label>biome <select id="biome"></select></label>
    </div>
    <div class="readout">
      <div class="swatch"><canvas id="hoverPix" width="64" height="64"></canvas>
        <div><b id="hoverCo">—</b><div class="key" id="hoverKey">hover a tile</div></div></div>
      <div class="swatch"><canvas id="pickPix" width="64" height="64"></canvas>
        <div><b id="pickCo">—</b><div class="key" id="pickKey">click to copy</div>
          <div class="paintLinks" id="pickPaint"></div></div></div>
    </div>
  </header>

  <main><canvas id="sheet"></canvas></main>
  <div id="claimed"></div>

<script type="module">
import {
  BIOME_KEYS,
  BIOME_TILES,
  TILES,
  SHEET_COLS,
  SHEET_ROWS,
  SHEET_GAP,
  SHEET_PATH,
  biomeKey,
} from './src/data/tiles.js';
import { paintOf } from './src/data/paint.js';
import { BIOMES, DEFAULT_BIOME, biomeDef } from './src/data/biomes.js';
import { gemColour, getPalette, setDefaultPalette } from './src/config.js';

const TILE = 16;
const STRIDE = TILE + SHEET_GAP;
const GUTTER = { left: 30, top: 16 };
const CELL_GAP = 2;
// The sheet is 49 tiles across, which at 2x is about as wide as a page can be
// and still be scanned; there is nothing to choose here.
const SCALE = 2;

// The table flattened to one row per tile, since a key can name several — the
// terrains that alternate between tiles list each one as `key #n`. A tile a
// biome draws differently is claimed under its own name (`rock@frozen`), so the
// sheet shows every tile the game draws whichever world it is drawing.
const entries = [];
const flatten = (key, tile) => {
  if (Array.isArray(tile[0])) tile.forEach(([col, row], n) => entries.push([`${key}-${n}`, col, row]));
  else entries.push([key, tile[0], tile[1]]);
};
for (const [key, tile] of Object.entries(TILES)) flatten(key, tile);
// A biome only appears here where it actually draws something different: one
// that names the tiles every world already draws is handed the shared sprite,
// so there is no `rock@frozen` for the sheet to claim (`biomeKey`).
for (const [biome, own] of Object.entries(BIOME_TILES))
  for (const [key, tile] of Object.entries(own))
    if (biomeKey(key, biome) !== key) flatten(`${key}@${biome}`, tile);

// Which sprite keys sit on a given tile — more than one key can share a tile.
const claims = new Map();
for (const [key, col, row] of entries) {
  const at = `${col},${row}`;
  claims.set(at, (claims.get(at) || []).concat(key));
}

const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const el = (id) => document.getElementById(id);
const sheetEl = el('sheet');
const ctx = sheetEl.getContext('2d');

const biomeSel = el('biome');
BIOMES.forEach((b) => biomeSel.add(new Option(b.name, b.id)));
biomeSel.value = DEFAULT_BIOME;

// The page is drawn in the colour of the world being looked at, which is the
// whole of what the biome select does here: a world's colour is its biome's
// (src/data/biomes.js), so there is nothing else to pick.
setDefaultPalette(biomeDef(biomeSel.value).palette);
let palette = getPalette();
let tinted = null; // the sheet, recoloured to the palette's foreground
let picked = null;

// Recolours the whole sheet in one pass: draw it, then flood the foreground
// through its own alpha. Same trick the game plays with a tint, so this page
// shows what a tile will actually look like in play.
function retint(image) {
  const off = document.createElement('canvas');
  off.width = image.width;
  off.height = image.height;
  const c = off.getContext('2d');
  c.drawImage(image, 0, 0);
  c.globalCompositeOperation = 'source-in';
  c.fillStyle = hex(palette.fg);
  c.fillRect(0, 0, off.width, off.height);
  return off;
}

const cellPitch = () => TILE * SCALE + CELL_GAP;
const cellX = (col) => GUTTER.left + col * cellPitch();
const cellY = (row) => GUTTER.top + row * cellPitch();

// The gem a key's paint leads with, or null if it has no zones on it — what the
// sheet and the list below mark a painted tile with.
function paintedHue(key) {
  const entry = paintOf(key);
  if (!entry) return null;
  const hues = Array.isArray(entry.hues) ? entry.hues : [];
  if (!hues.length) return null;
  const hue = hues[0];
  return typeof hue === 'number' ? hue : 1;
}

function draw() {
  const pitch = cellPitch();
  sheetEl.width = GUTTER.left + SHEET_COLS * pitch;
  sheetEl.height = GUTTER.top + SHEET_ROWS * pitch;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = hex(palette.bg);
  ctx.fillRect(0, 0, sheetEl.width, sheetEl.height);

  ctx.font = '9px monospace';
  ctx.textBaseline = 'middle';

  // The coordinates are the point of the page, so they are always on.
  ctx.fillStyle = hex(palette.fg);
  ctx.globalAlpha = 0.55;
  ctx.textAlign = 'center';
  for (let col = 0; col < SHEET_COLS; col++)
    ctx.fillText(String(col), cellX(col) + (TILE * SCALE) / 2, GUTTER.top / 2);
  ctx.textAlign = 'right';
  for (let row = 0; row < SHEET_ROWS; row++)
    ctx.fillText(String(row), GUTTER.left - 6, cellY(row) + (TILE * SCALE) / 2);
  ctx.globalAlpha = 1;

  for (let row = 0; row < SHEET_ROWS; row++) {
    for (let col = 0; col < SHEET_COLS; col++) {
      const x = cellX(col);
      const y = cellY(row);
      const size = TILE * SCALE;
      ctx.fillStyle = hex(palette.fg);
      ctx.globalAlpha = 0.07;
      ctx.fillRect(x, y, size, size);
      ctx.globalAlpha = 1;
      ctx.drawImage(tinted, col * STRIDE, row * STRIDE, TILE, TILE, x, y, size, size);

      const keys = claims.get(`${col},${row}`);
      if (keys) {
        // A tile with zones on it is boxed in the colour of the first gem its
        // paint names, so what is already painted reads off the sheet.
        const painted = keys.map(paintedHue).find((hue) => hue !== null);
        ctx.strokeStyle = hex(painted === undefined ? palette.fg : gemColour(painted));
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
      }
      if (picked && picked[0] === col && picked[1] === row) {
        ctx.strokeStyle = hex(palette.fg);
        ctx.lineWidth = 2;
        ctx.strokeRect(x - 1, y - 1, size + 2, size + 2);
      }
    }
  }
}

// Screen position -> tile, or null in a gutter or a gap between cells.
function tileAt(px, py) {
  const pitch = cellPitch();
  const col = Math.floor((px - GUTTER.left) / pitch);
  const row = Math.floor((py - GUTTER.top) / pitch);
  if (col < 0 || row < 0 || col >= SHEET_COLS || row >= SHEET_ROWS) return null;
  return [col, row];
}

function showIn(canvasId, coId, keyId, tile, { paintLinksId } = {}) {
  const pix = el(canvasId).getContext('2d');
  pix.imageSmoothingEnabled = false;
  pix.clearRect(0, 0, 64, 64);
  const co = el(coId);
  const key = el(keyId);
  const paintLinks = paintLinksId ? el(paintLinksId) : null;
  if (paintLinks) paintLinks.replaceChildren();
  if (!tile) {
    co.textContent = '—';
    key.textContent = '';
    return;
  }
  pix.drawImage(tinted, tile[0] * STRIDE, tile[1] * STRIDE, TILE, TILE, 0, 0, 64, 64);
  co.textContent = `${tile[0]}, ${tile[1]}`;
  const keys = claims.get(tile.join(','));
  key.textContent = keys ? keys.join(', ') : 'unused';
  key.className = keys ? 'key' : 'key dim';
  if (paintLinks) {
    const link = (href, text) => {
      const a = document.createElement('a');
      a.href = href;
      a.textContent = text;
      paintLinks.append(a);
    };
    for (const k of keys || []) link(`paint.html?key=${encodeURIComponent(k)}`, `paint ${k} →`);
    link(`draw.html?col=${tile[0]}&row=${tile[1]}`, 'draw this tile →');
    // Which sprite a world draws this tile as is the biome tool's question, and
    // the answer is a list rather than a coordinate — so the link hands it the
    // key and the world being looked at rather than the tile.
    const world =
      keys &&
      keys.map((k) => k.split('@')[0].replace(/-\d+$/, '')).find((k) => BIOME_KEYS.includes(k));
    if (world)
      link(
        `biomes.html?key=${encodeURIComponent(world)}&biome=${encodeURIComponent(biomeSel.value)}`,
        `assign ${world} →`
      );
  }
}

sheetEl.addEventListener('mousemove', (e) => {
  const r = sheetEl.getBoundingClientRect();
  showIn('hoverPix', 'hoverCo', 'hoverKey', tileAt(e.clientX - r.left, e.clientY - r.top));
});

sheetEl.addEventListener('click', (e) => {
  const r = sheetEl.getBoundingClientRect();
  const tile = tileAt(e.clientX - r.left, e.clientY - r.top);
  if (!tile) return;
  pick(tile);
});

function pick(tile) {
  picked = tile;
  showIn('pickPix', 'pickCo', 'pickKey', tile, { paintLinksId: 'pickPaint' });
  // Best-effort: a page opened without a secure context has no clipboard, and
  // the coordinate is on screen either way.
  navigator.clipboard?.writeText(`[${tile[0]}, ${tile[1]}]`).catch(() => {});
  draw();
}

// The table as it stands, so what the game currently draws is readable without
// hunting for the boxes on the sheet. Each row opens straight into the paint
// tool for that key.
function listClaimed() {
  const host = el('claimed');
  host.replaceChildren();
  for (const [key, col, row] of entries) {
    const line = document.createElement('a');
    line.href = `paint.html?key=${encodeURIComponent(key)}`;
    const pix = document.createElement('canvas');
    pix.width = pix.height = 32;
    const c = pix.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.drawImage(tinted, col * STRIDE, row * STRIDE, TILE, TILE, 0, 0, 32, 32);
    const name = document.createElement('span');
    name.textContent = key;
    const hue = paintedHue(key);
    if (hue !== null) {
      name.className = 'painted';
      name.style.color = hex(gemColour(hue));
    }
    const co = document.createElement('span');
    co.className = 'co';
    co.textContent = `${col}, ${row}`;
    line.append(pix, name, co);
    line.addEventListener('click', (e) => {
      // A plain click jumps to the tile on this page; only a modifier click (or
      // middle click) follows the link out to the paint tool.
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button === 1) return;
      e.preventDefault();
      pick([col, row]);
      window.scrollTo({ top: cellY(row), behavior: 'smooth' });
    });
    host.append(line);
  }
}

function repaint() {
  document.documentElement.style.setProperty('--bg', hex(palette.bg));
  document.documentElement.style.setProperty('--fg', hex(palette.fg));
  draw();
  listClaimed();
  showIn('pickPix', 'pickCo', 'pickKey', picked, { paintLinksId: 'pickPaint' });
}

biomeSel.addEventListener('change', () => {
  // The game reads its palette from the same place, so picking a world here is
  // picking one there — which is the point: a tile has to read against the
  // background of the world it is going to be drawn in.
  setDefaultPalette(biomeDef(biomeSel.value).palette);
  palette = getPalette();
  tinted = retint(source);
  repaint();
});

const source = new Image();
source.src = SHEET_PATH;
await source.decode();
tinted = retint(source);

// Arriving from the paint tool with ?key=... jumps straight to that tile.
const wantedKey = new URLSearchParams(location.search).get('key');
const wanted = wantedKey && entries.find(([key]) => key === wantedKey);
if (wanted) picked = [wanted[1], wanted[2]];

repaint();
if (wanted) window.scrollTo({ top: cellY(wanted[2]) });
</script>
</body>
</html>
