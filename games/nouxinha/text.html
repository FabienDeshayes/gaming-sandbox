<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nouxinha — the words</title>
  <style>
    /* A development page, not part of the game. It reads `src/text.js` as
       source, finds every string in it, and puts each one in a box with a
       legend saying where the player meets it — so the whole voice of the game
       can be reviewed in the order it is heard rather than in the order it is
       declared.

       It edits the *source* and nothing else: every string is recorded by its
       offset in the file, so exporting is the same file back with the edited
       strings swapped in at their offsets. A string nobody touched is written
       out byte for byte, comments and all, which is what makes the export safe
       to drop straight over `src/text.js`.

       The page is drawn in a biome's colour, like the other five, since that
       is the colour the words will be read in; there is no palette to pick, in
       here or in the game — a world's colour is its biome's. */
    :root { --bg: #0b1a0b; --fg: #33ff66; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 monospace;
      -webkit-font-smoothing: none;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      position: sticky; top: 0; z-index: 3;
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 30%, transparent);
    }
    .title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
    h1 { font-size: 15px; margin: 0; letter-spacing: 2px; }
    a { color: var(--fg); }
    .navlink { opacity: 0.65; text-decoration: none; }
    .navlink:hover { opacity: 1; text-decoration: underline; }
    .controls { display: flex; gap: 14px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    label { opacity: 0.65; }
    select, button, input {
      font: inherit; color: var(--fg); background: transparent;
      border: 1px solid color-mix(in srgb, var(--fg) 45%, transparent);
      padding: 6px 10px; cursor: pointer;
      min-height: 32px;
    }
    input[type=search] { cursor: text; min-width: 220px; }
    button:hover, select:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
    button[disabled] { opacity: 0.3; cursor: default; }
    button[disabled]:hover { background: transparent; }
    .check { display: flex; gap: 6px; align-items: center; cursor: pointer; opacity: 0.65; }
    .check:hover { opacity: 1; }
    .check input { min-height: 0; width: auto; cursor: pointer; accent-color: var(--fg); }
    .tally { margin-left: auto; opacity: 0.65; }
    .tally b { opacity: 1; }
    .blurb { padding: 12px 16px 0; max-width: 78ch; opacity: 0.6; }
    .jump { padding: 10px 16px 0; display: flex; gap: 6px 16px; flex-wrap: wrap; }
    .jump a { text-decoration: none; opacity: 0.6; font-size: 12px; }
    .jump a:hover { opacity: 1; text-decoration: underline; }

    main { padding: 16px 16px 120px; }

    /* A group is one part of the game: the HUD, the stones, the items. */
    .group { margin: 34px 0 0; }
    .group > h2 {
      font-size: 13px; margin: 0 0 2px; letter-spacing: 2px;
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 30%, transparent);
      padding-bottom: 6px;
      display: flex; gap: 12px; align-items: baseline;
    }
    .group > h2 .count { margin-left: auto; opacity: 0.45; font-weight: normal; letter-spacing: 0; }
    .group > .note { opacity: 0.55; margin: 8px 0 0; max-width: 78ch; }

    /* A subject is one thing inside it: one landmark, one stone, one item. */
    .subject { margin: 18px 0 0; padding-left: 12px; border-left: 1px solid color-mix(in srgb, var(--fg) 22%, transparent); }
    .subject > h3 { font-size: 13px; margin: 0; letter-spacing: 1px; }
    .subject > h3 .sub { opacity: 0.45; letter-spacing: 0; font-weight: normal; margin-left: 10px; }
    .subject > .note { opacity: 0.55; margin: 4px 0 0; max-width: 78ch; }

    /* A sequence is text the player meets in order — one array in the source.
       The rail down its left is what says "these are read one after another". */
    .seq { margin: 12px 0 0; padding: 8px 0 8px 14px; position: relative; }
    .seq::before {
      content: ''; position: absolute; left: 3px; top: 12px; bottom: 12px; width: 1px;
      background: color-mix(in srgb, var(--fg) 40%, transparent);
    }
    .seq > .seqhead { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
    .seq > .seqhead b { letter-spacing: 1px; }
    .seq > .seqhead .kind {
      font-size: 11px; letter-spacing: 1px; padding: 1px 6px;
      border: 1px solid color-mix(in srgb, var(--fg) 45%, transparent);
    }
    .seq > .note { opacity: 0.55; margin: 4px 0 0; max-width: 78ch; }

    .entry { margin: 14px 0 0; padding-left: 10px; border-left: 3px solid transparent; }
    .entry.edited { border-left-color: color-mix(in srgb, var(--fg) 55%, transparent); }
    .field { margin: 10px 0 0; padding-left: 8px; border-left: 3px solid transparent; }
    .field.edited { border-left-color: var(--fg); }
    .entry .meta { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .entry .block {
      font-size: 11px; letter-spacing: 1px; opacity: 0.85;
      border: 1px solid color-mix(in srgb, var(--fg) 45%, transparent);
      padding: 0 5px; flex: none;
    }
    .entry .label { letter-spacing: 1px; }
    .entry .path { opacity: 0.4; font-size: 11px; }
    .entry .badge {
      font-size: 11px; letter-spacing: 1px; padding: 0 6px;
      background: var(--fg); color: var(--bg);
    }
    .entry .badge.warn { background: transparent; color: var(--fg); border: 1px dashed var(--fg); }
    .entry .badge.stale { background: transparent; color: var(--fg); border: 1px dotted var(--fg); }
    .entry .when { opacity: 0.55; margin: 2px 0 4px; max-width: 78ch; }
    .entry .when.missing { opacity: 0.8; font-style: italic; }
    .field .meta { margin-bottom: 3px; }
    .entry textarea {
      display: block; width: 100%; max-width: 92ch;
      font: 13px/1.55 monospace; color: var(--fg); background: color-mix(in srgb, var(--fg) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent);
      padding: 7px 9px; resize: vertical; overflow: hidden;
    }
    .field.edited textarea { border-color: color-mix(in srgb, var(--fg) 70%, transparent); }
    .entry textarea:focus { outline: none; border-color: var(--fg); background: color-mix(in srgb, var(--fg) 12%, transparent); }
    .entry .was {
      max-width: 92ch; margin-top: 4px; padding: 5px 9px;
      border-left: 1px solid color-mix(in srgb, var(--fg) 35%, transparent);
      opacity: 0.55; white-space: pre-wrap;
    }
    .entry .was b { opacity: 0.8; font-weight: normal; letter-spacing: 1px; }
    .entry .tools { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
    .entry .tools button { padding: 2px 8px; min-height: 0; font-size: 11px; letter-spacing: 1px; }
    /* A ${…} in the text: the value the game drops in at that point. */
    .hole { background: color-mix(in srgb, var(--fg) 22%, transparent); padding: 0 2px; }
    .preview { max-width: 92ch; margin-top: 4px; opacity: 0.75; white-space: pre-wrap; }

    dialog {
      background: var(--bg); color: var(--fg);
      border: 1px solid var(--fg); max-width: 96vw; width: 900px;
      font: 13px/1.5 monospace; padding: 16px;
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.72); }
    dialog h2 { font-size: 13px; margin: 0 0 4px; letter-spacing: 2px; }
    dialog .note { opacity: 0.6; margin: 0 0 10px; }
    dialog textarea {
      width: 100%; height: 40vh; font: 11px/1.45 monospace;
      color: var(--fg); background: color-mix(in srgb, var(--fg) 6%, transparent);
      border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent); padding: 8px;
    }
    dialog .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .tabs { display: flex; gap: 10px; margin-bottom: 8px; }
    .tabs button[aria-selected=true] { background: var(--fg); color: var(--bg); }
    .empty { opacity: 0.5; padding: 40px 0; }
  </style>
</head>

<script type="module">
import { BIOMES, DEFAULT_BIOME, biomeDef } from './src/data/biomes.js';
import { getPalette, hex, setDefaultPalette } from './src/config.js';

const SOURCE = './src/text.js';
const STORE = 'nouxinha.textReview';

// --- Reading the source ------------------------------------------------------
//
// A scanner rather than a parser: it walks the file, skips comments, consumes
// every string literal whole, and keeps a stack of the braces and brackets it
// is inside so it can say which key each literal sits under. That gives every
// string a *path* — `SLOTS.empty`, `LANDMARK_TEXT.mint.met[0]` — which is both
// what the page groups on and what the export names a change by.
//
// Three things it is deliberate about:
//
//   - a template literal is one string, `${...}` and all. The bits inside an
//     interpolation are code, not words, and splitting them out would offer
//     `'S'` and `''` as things to review.
//   - a `[` straight after a value is a lookup, not an array, so the strings in
//     `LANDMARK_TEXT[id][again ? 'again' : 'met']` are code and never listed.
//   - several strings can share a path — the branches of a ternary. They are
//     kept in order as *variants* of the same entry rather than merged.
//
// Every literal records its offsets, and nothing else in the file is touched,
// so a scan followed by a rebuild is byte-identical. If the scanner is ever
// confused by a shape this file does not use today, it mislabels a path — it
// cannot misplace an edit.

function scanSource(src) {
  const out = [];
  const stack = [];
  const ords = new Map();
  let root = null;
  let pendingKey = null;
  let prev = 'op'; // 'word' | 'close' | 'string' | 'op' — enough to tell a lookup from an array
  let i = 0;

  const isIdStart = (c) => /[A-Za-z_$]/.test(c);
  const isId = (c) => /[A-Za-z0-9_$]/.test(c);
  const top = () => (stack.length ? stack[stack.length - 1] : null);
  const inCode = () => stack.some((f) => f.code);

  function pathHere() {
    let s = root || '';
    for (const f of stack) {
      if (f.key != null) s += (s ? '.' : '') + f.key;
      if (f.kind === 'array') s += `[${f.index}]`;
    }
    if (pendingKey != null) s += (s ? '.' : '') + pendingKey;
    return s;
  }

  // Consume a string or template starting at `start`; returns the index past it.
  function readString(start) {
    const q = src[start];
    let j = start + 1;
    while (j < src.length) {
      const c = src[j];
      if (c === '\\') { j += 2; continue; }
      if (c === q) return j + 1;
      if (q === '`' && c === '$' && src[j + 1] === '{') { j = readBraces(j + 2); continue; }
      j++;
    }
    return j;
  }
  // Consume a `${ ... }`, strings and comments and nested braces included.
  function readBraces(start) {
    let j = start;
    let depth = 1;
    while (j < src.length && depth > 0) {
      const c = src[j];
      if (c === "'" || c === '"' || c === '`') { j = readString(j); continue; }
      if (c === '/' && src[j + 1] === '/') { while (j < src.length && src[j] !== '\n') j++; continue; }
      if (c === '/' && src[j + 1] === '*') { j = src.indexOf('*/', j + 2) + 2; continue; }
      if (c === '{') depth++;
      if (c === '}') depth--;
      j++;
    }
    return j;
  }

  while (i < src.length) {
    const c = src[i];
    if (c === '/' && src[i + 1] === '/') { while (i < src.length && src[i] !== '\n') i++; continue; }
    if (c === '/' && src[i + 1] === '*') { i = src.indexOf('*/', i + 2) + 2; continue; }
    if (/\s/.test(c)) { i++; continue; }

    if (c === "'" || c === '"' || c === '`') {
      const end = readString(i);
      const raw = src.slice(i + 1, end - 1);
      // A quoted key — `'stone-1': [...]` — is a name, not a line of dialog.
      let k = end;
      while (k < src.length && /\s/.test(src[k])) k++;
      if (src[k] === ':' && top() && top().kind === 'object' && top().expectKey) {
        pendingKey = raw;
        top().expectKey = false;
        i = k + 1;
        prev = 'op';
        continue;
      }
      if (root && !inCode()) {
        const path = pathHere();
        const ord = ords.get(path) || 0;
        ords.set(path, ord + 1);
        out.push({ path, ord, quote: src[i], raw, start: i + 1, end: end - 1 });
      }
      i = end;
      prev = 'string';
      continue;
    }

    if (isIdStart(c)) {
      let j = i;
      while (j < src.length && isId(src[j])) j++;
      const word = src.slice(i, j);
      let k = j;
      while (k < src.length && /\s/.test(src[k])) k++;
      // The one import at the top of the file: a module path, not words.
      if (word === 'import' && !stack.length) {
        const semi = src.indexOf(';', j);
        i = semi < 0 ? src.length : semi + 1;
        prev = 'op';
        continue;
      }
      if (src[k] === ':' && src[k + 1] !== ':' && top() && top().kind === 'object' && top().expectKey) {
        pendingKey = word;
        top().expectKey = false;
        i = k + 1;
        prev = 'op';
        continue;
      }
      if ((word === 'const' || word === 'let' || word === 'var') && !stack.length) {
        let m = j;
        while (m < src.length && /\s/.test(src[m])) m++;
        let n = m;
        while (n < src.length && isId(src[n])) n++;
        root = src.slice(m, n);
        i = n;
        prev = 'word';
        continue;
      }
      i = j;
      prev = 'word';
      continue;
    }

    if (c === '{' || c === '[' || c === '(') {
      // `x[...]` is a lookup and `(a, b) =>` is a parameter list: neither names
      // anything, and a lookup's contents are code.
      const code = c === '[' && (prev === 'word' || prev === 'close' || prev === 'string');
      const owns = !code && (c === '{' || c === '[');
      stack.push({
        kind: c === '{' ? 'object' : c === '[' ? 'array' : 'group',
        key: owns ? pendingKey : null,
        index: 0,
        expectKey: c === '{',
        savedKey: pendingKey,
        code,
      });
      if (owns) pendingKey = null;
      i++;
      prev = 'op';
      continue;
    }
    if (c === '}' || c === ']' || c === ')') {
      const frame = stack.pop();
      // A group or a lookup hands the key it was standing in back: the value of
      // `suspended: (a, b) => \`...\`` is still `suspended`.
      pendingKey = frame && (frame.kind === 'group' || frame.code) ? frame.savedKey : null;
      i++;
      prev = 'close';
      continue;
    }
    if (c === ',') {
      const f = top();
      if (f && f.kind === 'object') f.expectKey = true;
      if (f && f.kind === 'array') f.index++;
      if (!f || f.kind !== 'group') pendingKey = null;
      i++;
      prev = 'op';
      continue;
    }
    if (c === ';' && !stack.length) { root = null; i++; prev = 'op'; continue; }
    i++;
    prev = 'op';
  }
  return out;
}

// The source's escapes, in and out. Only the ones this file uses: a `\$` is
// left alone so an escaped interpolation could never be quietly unescaped.
function decode(raw, quote) {
  return raw.replace(/\\(['"`\\nrt])/g, (_, c) => ({ n: '\n', r: '\r', t: '\t' }[c] || c));
}
function encode(text, quote) {
  let s = text.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/\r/g, '\\r').replace(/\t/g, '\\t');
  if (quote === '`') s = s.replace(/`/g, '\\`');
  else s = s.split(quote).join('\\' + quote);
  return s;
}

// The `${...}` spans in a string, whole and in order. Used to show them and to
// notice when an edit has dropped or invented one.
function holesIn(text) {
  const out = [];
  for (let i = 0; i < text.length; i++) {
    if (text[i] !== '$' || text[i + 1] !== '{') continue;
    let j = i + 2;
    let depth = 1;
    while (j < text.length && depth > 0) {
      if (text[j] === '{') depth++;
      else if (text[j] === '}') depth--;
      else if (text[j] === "'" || text[j] === '"' || text[j] === '`') {
        const q = text[j++];
        while (j < text.length && text[j] !== q) j += text[j] === '\\' ? 2 : 1;
      }
      j++;
    }
    out.push(text.slice(i, j));
    i = j - 1;
  }
  return out;
}

// --- The legends -------------------------------------------------------------
//
// What the page knows that the source cannot say for itself: where the player
// meets a string. A group is a part of the game, a subject is one thing inside
// it — a landmark, a stone, an item — and a legend is one line about when a
// string is on screen.
//
// Nothing here is loaded by the game, and nothing in `src/text.js` depends on
// it. A string with no legend still shows up, flagged, so the list can never
// quietly go out of date with the file it is describing.

const GROUPS = [
  {
    id: 'shared', name: 'WORDS USED MORE THAN ONCE', roots: ['UI'],
    note: 'One word, several screens. Editing one of these lands everywhere it is used at once.',
  },
  {
    id: 'title', name: 'THE TITLE SCREEN', roots: ['TITLE'],
    note: 'The first thing on screen, and what the game calls itself.',
  },
  {
    id: 'slots', name: 'THE SAVE SLOTS', roots: ['SLOTS', 'progressLine', 'BIOME_NAMES'],
    note: 'The three rows behind NEW GAME and LOAD GAME, and what each row says a campaign has to show for itself.',
  },
  {
    id: 'settings', name: 'SETTINGS', roots: ['SETTINGS'],
    note: 'Every row is a switch that says its own state, so the copy and the setting can never drift apart.',
  },
  {
    id: 'hud', name: 'THE HUD', roots: ['HUD'],
    note: 'The counters under the world, on screen for the whole walk.',
  },
  {
    id: 'flash', name: 'THE STATUS LINE', roots: ['FLASH'],
    note: 'One transient shout under the HUD, said by the step just taken and then gone. All caps: this is the game’s chrome, not the game talking.',
  },
  {
    id: 'carried', name: 'WHAT A RUN IS CARRYING', roots: ['CARRIED'],
    note: 'Not lines of their own — fragments the hut, the menu and the death screen build one sentence out of: “The colour, the compass and 30 coins”.',
  },
  {
    id: 'dialogs', name: 'THE DIALOGS', roots: ['EDGE', 'MENU', 'SAVED', 'LEAVING', 'HUT', 'HALL', 'RECAP', 'DEATH'],
    note: 'A bordered box over the world with a title, a few lines, sometimes a table of numbers, and its buttons. Sentence case in the body is the game talking to you; the rest is chrome.',
  },
  {
    id: 'say', name: 'THE TEXT PANEL', roots: ['SAY'],
    note: 'The game’s own voice: a box across the bottom that types itself out a character at a time and takes one tap per block. Everything here is read in blocks, in order.',
  },
  {
    id: 'hall', name: 'THE HALL — FIVE CONVERSATIONS', roots: ['HALL_SPEECH'],
    note: 'Nouxinha, on the text panel, at the end of a world. Which conversation you get is how many kinds of world this campaign had already finished when it walked in, so he says something different every time that count goes up.',
    depth: 1,
  },
  {
    id: 'landmarks', name: 'THE LANDMARKS', roots: ['LANDMARK_TEXT'],
    note: 'The seven that stand in every world, and the four that belong to one kind of world each. Walking into one reads it out on the text panel — at length the first time this campaign ever touches it, shorter in every world after.',
    depth: 2,
  },
  {
    id: 'signposts', name: 'THE SIGNPOSTS', roots: ['SIGNPOST'],
    note: 'What a post has burned into its arms. A reading is built from these at the moment it is read — a name, a heading and how far — so nothing here is a whole line on its own.',
  },
  {
    id: 'stones', name: 'THE CARVED STONES', roots: ['STONE_TEXT'],
    note: 'Four stones per world, cut by Nouxinha before any of this and read by walking into them. Each is written five ways: which cut you get is how many kinds of world this campaign has finished, and a campaign past the end keeps reading the last one.',
    depth: 2,
  },
  {
    id: 'panels', name: 'THE PANELS', roots: ['INVENTORY', 'CARD', 'SHOP', 'WORLD_MAP', 'COMPASS'],
    note: 'The things the rail opens over the world: what you are carrying, one item’s card, the stall, the map, and the badge the compass stands on.',
  },
  {
    id: 'items', name: 'THE ITEMS', roots: ['ITEM_TEXT'],
    note: 'What each item is called, and the one line its card says it does. A name is read in the HUD, the status line, the inventory and the stall, so it is the most reused string in the game.',
    depth: 2,
  },
  {
    id: 'credits', name: 'THE ENDING', roots: ['CREDITS'],
    note: 'After he opens his hands: the whole game drawn inside out, in the light, one line at a time. Credits are neither chrome nor the game talking — they are the game signing what it just did, so they are set the way the title screen is.',
  },
];

// One line per string: what it is called, and when the player is looking at it.
const LEGEND = {
  'UI.back': ['BACK', 'Out of Settings, out of the slot picker, and out of the dialog the edge of the world puts up.'],
  'UI.close': ['CLOSE', 'Shuts the inventory panel, an item’s card and the map.'],
  'UI.home': ['HOME', 'Leaves the recap and the death screen for the title screen.'],
  'UI.settings': ['SETTINGS', 'The title screen’s third button, and the first thing in the cogwheel menu.'],
  'UI.newGame': ['NEW GAME', 'The title screen’s first button, and the heading over the slot picker it opens.'],

// The families: text laid out the same way for every member, where a legend per
// string would be the same line eleven or twenty times over.
function sequenceInfo(seq, count) {
  let m;
  if ((m = seq.match(/^LANDMARK_TEXT\.[^.]+\.met$/))) {
    return ['THE FIRST TIME EVER', 'The text panel, the first time this campaign puts a hand on this place in any world. The last block is where it says what you are taking away.', 'blocks'];
  }
  if ((m = seq.match(/^LANDMARK_TEXT\.[^.]+\.again$/))) {
    return ['EVERY WORLD AFTER', 'The text panel, meeting it again in a world that has never seen it. Shorter, because the second time you are not discovering it — you are recognising it.', 'blocks'];
  }
  if ((m = seq.match(/^STONE_TEXT\.[^.]+\[(\d+)\]$/))) {
    const n = Number(m[1]);
    const when = [
      'Read by a campaign that has finished no kind of world yet — a stranger who may not know what a colour is for.',
      'Read once one kind of world has been finished.',
      'Read once two have.',
      'Read once three have.',
      'Read by somebody who has walked every country he has. A campaign past the end keeps reading this one for good.',
    ][n];
    return [`CUT ${n + 1} OF 5`, when, 'blocks'];
  }
  if ((m = seq.match(/^HALL_SPEECH\[(\d+)\]$/))) {
    const n = Number(m[1]);
    const when = [
      'The first time he is met: a campaign he has never been carried a full set by.',
      'Met with one kind of world finished.',
      'Met with two finished.',
      'Met with three finished — one left, and he would rather you did not.',
      'Met with four or more behind it. The meeting that would reach four carrying every colour is the ending instead, and never lands here.',
    ][n];
    return [`CONVERSATION ${n + 1} OF 5`, when, 'blocks'];
  }
  return SEQUENCES[seq];
}

function entryInfo(path) {
  let m;
  if ((m = path.match(/^LANDMARK_TEXT\.[^.]+\.name$/))) {
    return ['THE NAME', 'Read on the status line when the place is spent, on a signpost’s arm pointing at it, and in the sentence the hut reads back.'];
  }
  if ((m = path.match(/^LANDMARK_TEXT\.[^.]+\.standing$/))) {
    return ['THE STANDING', 'What putting a hand on this one changed for good. Copy rather than a rule — the rule is in src/core/rules.js — but the two are written to say the same thing.'];
  }
  if ((m = path.match(/^ITEM_TEXT\.[^.]+\.name$/))) {
    return ['THE NAME', 'The HUD, the status line, the inventory, the item card and the stall all read this one string.'];
  }
  if ((m = path.match(/^ITEM_TEXT\.[^.]+\.effect$/))) {
    return ['THE CARD', 'The line under the name on the card this item opens onto.'];
  }
  return LEGEND[path];
}

function loadEdits() {
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(STORE) || '{}'); } catch { stored = {}; }
  let dropped = 0;
  const live = new Set(entries.map(idOf));
  for (const id of Object.keys(stored)) if (!live.has(id)) dropped++;
  for (const e of entries) {
    const hit = stored[idOf(e)];
    if (!hit) continue;
    e.value = hit.v;
    // The source moved under this edit: both are worth seeing, so the edit
    // stands and the entry says so.
    e.stale = hit.b !== e.original;
  }
  return dropped;
}

function saveEdits() {
  const out = {};
  for (const e of entries) if (isEdited(e)) out[idOf(e)] = { v: e.value, b: e.original };
  try { localStorage.setItem(STORE, JSON.stringify(out)); } catch { /* a review that cannot be stored is still a review */ }
}

// --- Putting the file back together ------------------------------------------

function buildFile() {
  let out = '';
  let at = 0;
  for (const e of entries) {
    out += rawSrc.slice(at, e.start);
    // An untouched string goes back exactly as it came out, so a file with no
    // edits in it exports byte for byte identical to the one on disk.
    out += isEdited(e) ? encode(e.value, e.quote) : e.raw;
    at = e.end;
  }
  return out + rawSrc.slice(at);
}

// The export's own check: read the file this page just wrote the same way it
// read the one on disk, and make sure every string is still where it was. It
// will not catch every way an edit could go wrong, but it catches the one that
// matters — an edit that closed a string early and took the rest of the file
// with it.
function checkFile(text) {
  const again = scanSource(text);
  if (again.length !== entries.length) return `the rebuilt file holds ${again.length} strings, not ${entries.length}`;
  for (let i = 0; i < again.length; i++) {
    if (again[i].path !== entries[i].path || again[i].ord !== entries[i].ord) {
      return `the rebuilt file reads ${again[i].path} where ${entries[i].path} should be`;
    }
  }
  return null;
}

function buildEditList() {
  const changed = entries.filter(isEdited);
  if (!changed.length) return 'Nothing has been changed.\n';
  const lines = [
    `# ${changed.length} text change${changed.length === 1 ? '' : 's'} for games/nouxinha/src/text.js`,
    '',
    'Each heading is the path of a string literal in that file. Replace the string at that path with `now`; leave everything else alone.',
    '',
  ];
  for (const e of changed) {
    const variants = entries.filter((o) => o.path === e.path).length;
    lines.push(`## ${e.path}${variants > 1 ? ` (variant ${e.ord + 1} of ${variants})` : ''}`);
    const info = entryInfo(e.path);
    if (info) lines.push(`_${info[1]}_`, '');
    lines.push('- was: ' + JSON.stringify(e.original));
    lines.push('- now: ' + JSON.stringify(e.value));
    if (e.stale) lines.push('- NOTE: this edit was made against a different version of that string.');
    lines.push('');
  }
  return lines.join('\n');
}

// --- Drawing -----------------------------------------------------------------

const text = (tag, cls, s) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (s != null) n.textContent = s;
  return n;
};

// A string with its `${...}` picked out, so what the game drops in at that point
// is visible without pretending to be a word.
function withHoles(s) {
  const wrap = text('div', 'preview');
  let at = 0;
  for (const hole of holesIn(s)) {
    const i = s.indexOf(hole, at);
    if (i > at) wrap.append(s.slice(at, i));
    wrap.append(text('span', 'hole', hole));
    at = i + hole.length;
  }
  if (at < s.length) wrap.append(s.slice(at));
  return wrap;
}

function autosize(ta) {
  ta.style.height = 'auto';
  ta.style.height = `${ta.scrollHeight + 2}px`;
}

function rootOf(path) {
  return path.split('.')[0].replace(/\[\d+\].*$/, '');
}
function subjectOf(path, depth) {
  return path
    .split('.')
    .slice(0, depth)
    .map((seg) => seg.replace(/\[\d+\]/g, ''))
    .join('.');
}
function seqOf(path) {
  const m = path.match(/^(.*)\[(\d+)\]$/);
  return m ? { seq: m[1], index: Number(m[2]) } : null;
}

function matches(e, q) {
  if (!q) return true;
  const info = entryInfo(e.path);
  return (
    e.value.toLowerCase().includes(q) ||
    e.original.toLowerCase().includes(q) ||
    e.path.toLowerCase().includes(q) ||
    (info ? (info[0] + ' ' + info[1]).toLowerCase().includes(q) : false)
  );
}

// One string and everything the page knows about it. `place` is the sequence it
// stands in, if it stands in one: a block of a dialog carries its position and
// leans on the sequence's own legend rather than repeating it.
function drawEntry(list, slot, place) {
  const [first] = slot;
  const info = entryInfo(first.path);
  const seq = seqOf(first.path);
  const box = text('div', 'entry');
  const meta = text('div', 'meta');
  if (seq && place) meta.append(text('span', 'block', `${seq.index + 1}/${place.count}`));
  const label = info
    ? info[0]
    : place
      ? BLOCK_WORD[place.mode] ?? BLOCK_WORD.lines
      : first.path.split('.').pop().toUpperCase();
  if (label) meta.append(text('b', 'label', label));
  meta.append(text('code', 'path', first.path));
  box.append(meta);
  // A block of a sequence with nothing of its own to say is not missing a
  // legend: the sequence above it is its legend.
  if (info) box.append(text('div', 'when', info[1]));
  else if (!place) {
    box.append(text('div', 'when missing',
      'No legend for this one yet — say what it is in the LEGEND table in text.html.'));
  }
  for (const e of slot) box.append(drawField(e, slot.length));
  box.classList.toggle('edited', slot.some(isEdited));
  list.append(box);
}

function drawField(e, variants) {
  const wrap = text('div', 'field');
  nodes.set(idOf(e), wrap);
  if (variants > 1) {
    const names = VARIANTS[e.path] || VARIANTS[normalise(e.path)];
    const meta = text('div', 'meta');
    meta.append(text('span', 'path', `variant ${e.ord + 1} of ${variants}${names && names[e.ord] ? ` — ${names[e.ord]}` : ''}`));
    wrap.append(meta);
  }
  const ta = document.createElement('textarea');
  ta.value = e.value;
  ta.spellcheck = true;
  ta.addEventListener('input', () => {
    e.value = ta.value;
    autosize(ta);
    saveEdits();
    mark(e);
    tally();
  });
  wrap.append(ta);
  wrap.append(text('div', 'tools'));
  mark(e, wrap);
  requestAnimationFrame(() => autosize(ta));
  return wrap;
}

// The cue that a string is no longer the one in the file: a bar down its side,
// a badge, and the string it used to be, kept underneath where it can be read
// against the new one.
function mark(e, node) {
  const wrap = node || nodes.get(idOf(e));
  if (!wrap) return;
  wrap.classList.toggle('edited', isEdited(e));
  // The legend around it carries a fainter bar, so a changed string is visible
  // from the group's own heading and not only from the box it is in.
  const owner = wrap.parentElement && wrap.parentElement.closest('.entry');
  const meta = wrap.querySelector('.meta');
  for (const b of wrap.querySelectorAll(':scope > .meta > .badge')) b.remove();
  for (const w of wrap.querySelectorAll(':scope > .was, :scope > .preview')) w.remove();
  const tools = wrap.querySelector('.tools');
  tools.replaceChildren();

  const holes = holesIn(e.original);
  const now = holesIn(e.value);
  const lost = holes.slice().sort().join('\u0000') !== now.slice().sort().join('\u0000');
  const badges = [];
  if (isEdited(e)) badges.push(['badge', 'EDITED']);
  if (isEdited(e) && lost) badges.push(['badge warn', '⚠ PLACEHOLDERS']);
  if (e.stale) badges.push(['badge stale', 'SOURCE MOVED']);
  if (badges.length) {
    const bar = meta || (() => { const m = text('div', 'meta'); wrap.prepend(m); return m; })();
    for (const [cls, label] of badges) bar.append(text('span', cls, label));
  }

  // The string as it will read, with what the game drops in picked out.
  if (holes.length || now.length) wrap.insertBefore(withHoles(e.value), tools);
  if (isEdited(e)) {
    const was = text('div', 'was');
    was.append(text('b', null, 'was  '), e.original);
    wrap.insertBefore(was, tools);
    if (lost) {
      const warn = text('div', 'was');
      warn.append(text('b', null, 'the source holds  '), holes.length ? holes.join('  ') : 'no placeholders at all');
      wrap.insertBefore(warn, tools);
    }
    const revert = text('button', null, 'REVERT');
    revert.addEventListener('click', () => {
      e.value = e.original;
      e.stale = false;
      const ta = wrap.querySelector('textarea');
      ta.value = e.value;
      autosize(ta);
      saveEdits();
      mark(e);
      tally();
    });
    tools.prepend(revert);
  }
  if (owner) owner.classList.toggle('edited', !!owner.querySelector('.field.edited'));
}

function render() {
  const q = el('search').value.trim().toLowerCase();
  const onlyEdited = el('onlyEdited').checked;
  const main = el('main');
  main.replaceChildren();
  nodes.clear();
  const jump = el('jump');
  jump.replaceChildren();
  let shown = 0;

  for (const group of GROUPS) {
    const depth = group.depth || 1;
    const mine = [];
    for (const root of group.roots) {
      for (const e of entries) {
        if (rootOf(e.path) !== root) continue;
        if (onlyEdited && !isEdited(e)) continue;
        if (!matches(e, q)) continue;
        mine.push(e);
      }
    }
    const total = entries.filter((e) => group.roots.includes(rootOf(e.path)));
    const edited = total.filter(isEdited).length;
    const link = text('a', null, `${group.name}${edited ? ` (${edited})` : ''}`);
    link.href = `#g-${group.id}`;
    jump.append(link);
    if (!mine.length) continue;
    shown += mine.length;

    const sect = text('section', 'group');
    sect.id = `g-${group.id}`;
    const h2 = text('h2', null, group.name);
    h2.append(text('span', 'count', `${mine.length} of ${total.length}${edited ? ` · ${edited} changed` : ''}`));
    sect.append(h2);
    sect.append(text('p', 'note', group.note));

    let subject = null;
    let subjectBox = null;
    let seq = null;
    let seqBox = null;
    let place = null;
    let slot = [];

    const flush = () => {
      if (!slot.length) return;
      drawEntry(seqBox || subjectBox || sect, slot, seqBox ? place : null);
      slot = [];
    };

    for (const e of mine) {
      if (slot.length && slot[0].path !== e.path) flush();

      const nextSubject = subjectOf(e.path, depth);
      if (nextSubject !== subject) {
        flush();
        subject = nextSubject;
        seq = null;
        seqBox = null;
        const info = SUBJECTS[subject];
        if (depth > 1 || info) {
          subjectBox = text('div', 'subject');
          const named = entries.find((o) => o.path === `${subject}.name`);
          const label = info && info.length > 1 ? info[0] : named ? named.value : subject;
          const h3 = text('h3', null, label);
          h3.append(text('span', 'sub', subject));
          subjectBox.append(h3);
          const note = info ? info[info.length - 1] : null;
          if (note && (!info || info.length > 1 || note !== label)) subjectBox.append(text('p', 'note', note));
          sect.append(subjectBox);
        } else subjectBox = null;
      }

      const s = seqOf(e.path);
      if (!s) { seq = null; seqBox = null; place = null; }
      else if (s.seq !== seq) {
        flush();
        seq = s.seq;
        const count = new Set(
          entries.filter((o) => seqOf(o.path) && seqOf(o.path).seq === seq).map((o) => seqOf(o.path).index),
        ).size;
        const info = sequenceInfo(seq, count);
        place = { mode: (info && info[2]) || 'lines', count };
        seqBox = text('div', 'seq');
        const head = text('div', 'seqhead');
        head.append(text('b', null, info ? info[0] : seq.split('.').pop().toUpperCase()));
        head.append(text('span', 'kind', (MODE_KIND[info && info[2]] || MODE_KIND.lines)(count)));
        head.append(text('code', 'path', seq));
        seqBox.append(head);
        if (info) seqBox.append(text('p', 'note', info[1]));
        (subjectBox || sect).append(seqBox);
      }
      slot.push(e);
    }
    flush();
    main.append(sect);
  }

  if (!shown) main.append(text('p', 'empty', q || onlyEdited ? 'Nothing here matches.' : 'Nothing to show.'));
  tally();
}

function tally() {
  const edited = entries.filter(isEdited).length;
  el('tally').innerHTML = `<b>${entries.length}</b> strings · <b>${edited}</b> changed`;
  el('revertAll').disabled = !edited;
  for (const group of GROUPS) {
    // The jump row keeps its own count, so a change is visible from the top of
    // the page without scrolling to the group it is in.
    const n = entries.filter((e) => group.roots.includes(rootOf(e.path)) && isEdited(e)).length;
    const link = [...el('jump').children].find((a) => a.getAttribute('href') === `#g-${group.id}`);
    if (link) link.textContent = `${group.name}${n ? ` (${n})` : ''}`;
  }
}

// --- Export ------------------------------------------------------------------

let exportTab = 'file';

function showExport() {
  const changed = entries.filter(isEdited);
  const file = buildFile();
  const problem = changed.length ? checkFile(file) : null;
  el('exportText').value = exportTab === 'file' ? file : buildEditList();
  el('tabFile').setAttribute('aria-selected', String(exportTab === 'file'));
  el('tabEdits').setAttribute('aria-selected', String(exportTab === 'edits'));
  el('downloadExport').disabled = exportTab !== 'file';
  el('exportNote').textContent = !changed.length
    ? 'Nothing has been changed, so this is src/text.js exactly as it is on disk.'
    : problem
      ? `⚠ ${changed.length} change${changed.length === 1 ? '' : 's'}, but the rebuilt file does not read back cleanly: ${problem}. Find the edit that broke it before saving this over anything.`
      : `${changed.length} change${changed.length === 1 ? '' : 's'}. THE WHOLE FILE is src/text.js with those swapped in — every other byte, comments included, is untouched, and it reads back clean. JUST THE CHANGES is the same edits written out by path, to hand to Claude Code.`;
  el('exportStatus').textContent = '';
  if (!el('exportDialog').open) el('exportDialog').showModal();
}

async function copyExport() {
  const value = el('exportText').value;
  try {
    await navigator.clipboard.writeText(value);
    el('exportStatus').textContent = 'copied';
  } catch {
    el('exportText').select();
    el('exportStatus').textContent = 'select and copy';
  }
}

function downloadFile() {
  const blob = new Blob([buildFile()], { type: 'text/javascript' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'text.js';
  a.click();
  URL.revokeObjectURL(a.href);
  el('exportStatus').textContent = 'saved as text.js — it goes at games/nouxinha/src/text.js';
}

// --- The page ----------------------------------------------------------------

function paint() {
  setDefaultPalette(biomeDef(biome).palette);
  const palette = getPalette();
  document.documentElement.style.setProperty('--bg', hex(palette.bg));
  document.documentElement.style.setProperty('--fg', hex(palette.fg));
}

async function boot() {
  // Read as source rather than imported as a module: the page edits the strings
  // where they are written, and an import would only hand back their values.
  rawSrc = await fetch(`${SOURCE}?t=${Date.now()}`).then((r) => {
    if (!r.ok) throw new Error(`${SOURCE} came back ${r.status}`);
    return r.text();
  });
  entries = scanSource(rawSrc).map((e) => {
    const original = decode(e.raw, e.quote);
    return { ...e, original, value: original, stale: false };
  });
  const dropped = loadEdits();

  const groups = GROUPS.length;
  const missing = entries.filter((e) => !entryInfo(e.path) && !seqOf(e.path)).length;
  el('blurb').textContent =
    `Every string in src/text.js, in ${groups} groups, each with a line saying when the player is looking at it. ` +
    `Editing one here changes nothing on disk: EXPORT hands back the same file with the edited strings swapped in at their ` +
    `offsets — comments and all — to save over src/text.js, or the changes on their own to hand to Claude Code. ` +
    `A changed string keeps a bar down its side and the words it used to be underneath it, and the review is kept in this ` +
    `browser, so a reload carries on where you left off.` +
    (missing ? ` ${missing} string${missing === 1 ? ' has' : 's have'} no legend yet, flagged where they stand.` : '') +
    (dropped ? ` ${dropped} stored edit${dropped === 1 ? '' : 's'} no longer matched anything in the file and ${dropped === 1 ? 'was' : 'were'} dropped.` : '');

  const select = el('biome');
  for (const b of BIOMES) {
    const option = document.createElement('option');
    option.value = b.id;
    option.textContent = b.name.toLowerCase();
    select.append(option);
  }
  select.value = biome;
  select.addEventListener('change', () => { biome = select.value; paint(); });

  el('search').addEventListener('input', render);
  el('onlyEdited').addEventListener('change', render);
  el('export').addEventListener('click', showExport);
  el('tabFile').addEventListener('click', () => { exportTab = 'file'; showExport(); });
  el('tabEdits').addEventListener('click', () => { exportTab = 'edits'; showExport(); });
  el('copyExport').addEventListener('click', copyExport);
  el('downloadExport').addEventListener('click', downloadFile);
  el('closeExport').addEventListener('click', () => el('exportDialog').close());
  el('revertAll').addEventListener('click', () => {
    const n = entries.filter(isEdited).length;
    if (!confirm(`Put all ${n} changed string${n === 1 ? '' : 's'} back the way src/text.js has them?`)) return;
    for (const e of entries) { e.value = e.original; e.stale = false; }
    saveEdits();
    render();
  });

  paint();
  render();
}

boot().catch((err) => {
  el('main').textContent = `Could not read ${SOURCE}: ${err.message}. This page has to be opened through a web server, like the game.`;
});
</script>
</body>
</html>
