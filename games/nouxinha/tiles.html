<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nouxinha — tile sheet</title>
  <style>
    /* A development page, not part of the game. It does two things: it draws
       assets/tiles.png with its coordinates on it, so a sprite can be repointed
       by reading a label off the screen and editing one pair of numbers in
       src/data/tiles.js; and it paints a tile's colour zones, so which part of
       a tile turns which gem's colour can be drawn rather than typed
       (src/data/paint.js). */
    :root { --bg: #0b1a0b; --fg: #33ff66; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.5 monospace;
      -webkit-font-smoothing: none;
      -webkit-tap-highlight-color: transparent;
    }
    header {
      position: sticky; top: 0; z-index: 2;
      padding: 12px 16px;
      background: var(--bg);
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 30%, transparent);
    }
    h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: 2px; }
    h2 { font-size: 13px; margin: 0 0 8px; letter-spacing: 2px; }
    p { margin: 0; opacity: 0.65; max-width: 70ch; }
    .controls { display: flex; gap: 18px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    label { opacity: 0.65; }
    select, button, input[type=range] {
      font: inherit; color: var(--fg); background: transparent;
      border: 1px solid color-mix(in srgb, var(--fg) 45%, transparent);
      padding: 6px 10px; cursor: pointer;
      min-height: 34px;
    }
    button:hover, select:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
    button[disabled] { opacity: 0.35; cursor: default; }
    /* The readout: what is under the cursor, and what the last click picked. */
    .readout { display: flex; gap: 22px; align-items: center; margin-top: 10px; min-height: 76px; flex-wrap: wrap; }
    .swatch canvas { image-rendering: pixelated; display: block; }
    .swatch { display: flex; gap: 10px; align-items: center; }
    .swatch b { font-size: 20px; letter-spacing: 1px; }
    .swatch .key { opacity: 0.65; font-size: 12px; }
    .dim { opacity: 0.4; }

    /* The painter. */
    #painter {
      display: flex; gap: 26px; flex-wrap: wrap;
      padding: 16px;
      border-bottom: 1px solid color-mix(in srgb, var(--fg) 30%, transparent);
      overflow-x: auto;
    }
    /* Never stretched by the column it sits in: a grid scaled to a fraction of
       a pixel is a grid you can't line a zone up on. */
    #grid { image-rendering: pixelated; display: block; cursor: crosshair; touch-action: none; align-self: flex-start; }
    .pane { display: flex; flex-direction: column; gap: 10px; }
    .pane.wide { flex: 1 1 340px; min-width: 0; }
    .zone {
      display: flex; gap: 10px; align-items: center;
      padding: 8px 6px; cursor: pointer;
      border: 1px solid transparent;
    }
    .zone.on { border-color: var(--fg); }
    .zone i { width: 16px; height: 16px; display: block; border: 1px solid color-mix(in srgb, var(--fg) 40%, transparent); }
    .zone b { font-style: normal; width: 5.5em; }
    .zone .count { opacity: 0.5; margin-left: auto; }
    .row { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
    .steps { display: flex; gap: 14px; align-items: flex-end; overflow-x: auto; max-width: 100%; }
    .step { text-align: center; opacity: 0.85; }
    .step canvas { image-rendering: pixelated; display: block; }
    .step span { font-size: 11px; opacity: 0.6; }
    pre {
      margin: 0; padding: 8px; max-height: 210px; overflow: auto;
      border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent);
      background: color-mix(in srgb, var(--fg) 6%, transparent);
      font: 11px/1.45 monospace; white-space: pre;
    }
    main { padding: 16px; overflow-x: auto; }
    #sheet { image-rendering: pixelated; display: block; cursor: crosshair; }
    #claimed {
      padding: 0 16px 40px; display: grid; gap: 4px 22px;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    }
    #claimed div { display: flex; gap: 10px; align-items: center; cursor: pointer; }
    #claimed div:hover { background: color-mix(in srgb, var(--fg) 14%, transparent); }
    #claimed canvas { image-rendering: pixelated; }
    #claimed .co { margin-left: auto; opacity: 0.6; }
    #claimed .painted { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>NOUXINHA TILE SHEET</h1>
    <div class="controls">
      <label>palette <select id="palette"></select></label>
      <label>zoom <select id="zoom"></select></label>
      <label><input type="checkbox" id="labels" checked /> coordinates</label>
    </div>
    <div class="readout">
      <div class="swatch"><canvas id="hoverPix" width="64" height="64"></canvas>
        <div><b id="hoverCo">—</b><div class="key" id="hoverKey">hover a tile</div></div></div>
      <div class="swatch"><canvas id="pickPix" width="64" height="64"></canvas>
        <div><b id="pickCo">—</b><div class="key" id="pickKey">click to copy</div></div></div>
    </div>
  </header>

  <section id="painter">
    <div class="pane">
      <h2>ZONES</h2>
      <canvas id="grid"></canvas>
      <p>drag to paint &middot; right-drag to clear back to the base</p>
    </div>
    <div class="pane wide">
      <h2 id="painting">—</h2>
      <div class="row">
        <label>sprite <select id="sprite"></select></label>
        <span id="alias" class="dim"></span>
      </div>
      <div id="zones"></div>
      <div class="row">
        <label>this place's gem <select id="placeGem"></select></label>
        <label>opened by <select id="openedBy"></select></label>
      </div>
      <div class="steps" id="steps"></div>
      <div class="row">
        <button id="clear">CLEAR</button>
        <button id="revert">REVERT</button>
        <button id="copyEntry">COPY ENTRY</button>
        <button id="copyEdits">COPY EDITS</button>
        <span id="status" class="dim"></span>
      </div>
      <pre id="out"></pre>
    </div>
  </section>

  <main><canvas id="sheet"></canvas></main>
  <div id="claimed"></div>

<script type="module">
import { TILES, SHEET_COLS, SHEET_ROWS, SHEET_GAP, SHEET_PATH } from './src/data/tiles.js';
import { HUES, PAINT, PAINT_ZONES, ZONE_INK, paintOf } from './src/data/paint.js';
import { buildSprites } from './src/data/sprites.js';
import { hueColour } from './src/ui/painted.js';
import { FLOOR_TEXTURE_LEVEL, PALETTES, gemColour, getPalette, setPalette } from './src/config.js';

const TILE = 16;
const STRIDE = TILE + SHEET_GAP;
const GUTTER = { left: 30, top: 16 };
const CELL_GAP = 2;
const PX = 22; // one sprite pixel, in the painter's grid
const STEP_PX = 4; // ...and in the previews of the tile as the game draws it

// The table flattened to one row per tile, since a key can name several — the
// terrains that alternate between tiles list each one as `key #n`.
const entries = [];
for (const [key, tile] of Object.entries(TILES)) {
  if (Array.isArray(tile[0]))
    tile.forEach(([col, row], n) => entries.push([`${key}-${n}`, col, row]));
  else entries.push([key, tile[0], tile[1]]);
}

// Which sprite keys sit on a given tile — more than one key can share a tile.
const claims = new Map();
for (const [key, col, row] of entries) {
  const at = `${col},${row}`;
  claims.set(at, (claims.get(at) || []).concat(key));
}

const hex = (n) => '#' + n.toString(16).padStart(6, '0');
const el = (id) => document.getElementById(id);
const sheetEl = el('sheet');
const ctx = sheetEl.getContext('2d');

const paletteSel = el('palette');
PALETTES.forEach((p) => paletteSel.add(new Option(p.name, p.id)));
const zoomSel = el('zoom');
[2, 3, 4].forEach((z) => zoomSel.add(new Option(`${z}x`, String(z))));
zoomSel.value = '3';
const labelsBox = el('labels');

let scale = 3;
let palette = getPalette();
paletteSel.value = palette.id;
let tinted = null; // the sheet, recoloured to the palette's foreground
let picked = null;
let sprites = {}; // every sprite the game cuts out of the sheet, as masks

// Recolours the whole sheet in one pass: draw it, then flood the foreground
// through its own alpha. Same trick the game plays with a tint, so this page
// shows what a tile will actually look like in play.
function retint(image) {
  const off = document.createElement('canvas');
  off.width = image.width;
  off.height = image.height;
  const c = off.getContext('2d');
  c.drawImage(image, 0, 0);
  c.globalCompositeOperation = 'source-in';
  c.fillStyle = hex(palette.fg);
  c.fillRect(0, 0, off.width, off.height);
  return off;
}

// The same `readTile(col, row) -> mask` the game builds its sprites from
// (src/ui/textures.js), over a plain canvas rather than a Phaser texture: the
// sheet is transparent everywhere it isn't drawn on, so alpha *is* the mask.
function sheetReader(image) {
  const off = document.createElement('canvas');
  off.width = image.width;
  off.height = image.height;
  const c = off.getContext('2d', { willReadFrequently: true });
  c.drawImage(image, 0, 0);
  const { data } = c.getImageData(0, 0, off.width, off.height);
  return (col, row) => {
    const ox = col * STRIDE;
    const oy = row * STRIDE;
    return Array.from({ length: TILE }, (_, y) => {
      let line = '';
      for (let x = 0; x < TILE; x++)
        line += data[((oy + y) * off.width + ox + x) * 4 + 3] > 127 ? '#' : '.';
      return line;
    });
  };
}

const cellPitch = () => TILE * scale + CELL_GAP;
const cellX = (col) => GUTTER.left + col * cellPitch();
const cellY = (row) => GUTTER.top + row * cellPitch();

// --- The painter -------------------------------------------------------------
//
// A working copy of one sprite's zone map, plus every sprite edited since the
// page was opened — so a session of painting comes off the page as one block of
// entries to paste into src/data/paint.js rather than one tile at a time.

const edits = new Map();
let work = null; // { key, hues: [3], map: number[16][16] }
let brush = 1;

const zoneAt = (map, x, y) => (map[y] && map[y][x]) || 0;
const blankMap = () => Array.from({ length: TILE }, () => Array(TILE).fill(0));
const zonesUsed = (map) => Math.max(0, ...map.flat());

// Editable keys: everything the game cut, minus the zone textures cut *from*
// them — painting a zone of a zone is not a thing.
const spriteKeys = () => Object.keys(sprites).filter((k) => !/-z\d+$/.test(k));

// The colour a zone is *drawn* in, which is the game's own rule: a hue naming a
// gem you don't hold yet falls back to the base colour.
function zoneColour(zone, gems) {
  if (zone === 0) return palette.fg;
  const hue = work.hues[zone - 1];
  return hueColour(hue, {
    gems,
    base: palette.fg,
    roles: { gem: Number(el('placeGem').value), opened: Number(el('openedBy').value) },
  });
}

// ...and the colour it is *labelled* in while painting, which is a fixed one
// per zone: two zones can easily be drawn in the same colour on screen (before
// their gems are held), and telling them apart is the whole job here.
const zoneInk = (zone) => (zone === 0 ? palette.fg : gemColour(zone));

// Reads a table entry's zone map back into the grid the painter works on.
function readMap(map) {
  return Array.from({ length: TILE }, (_, y) =>
    Array.from({ length: TILE }, (_, x) => Math.max(0, ZONE_INK.indexOf((map[y] || '')[x])))
  );
}

function loadSprite(key, { keepEdit = true } = {}) {
  // An alias shares another key's paint, so painting it means painting that one.
  const aliasOf = typeof PAINT[key] === 'string' ? PAINT[key] : null;
  const real = aliasOf || key;
  const saved = keepEdit ? edits.get(real) : null;
  const entry = paintOf(real);
  const hueOf = (zone) => {
    if (saved) return saved.hues[zone];
    if (entry && entry.hues[zone] !== undefined) return entry.hues[zone];
    return zone + 1;
  };
  work = {
    key: real,
    hues: Array.from({ length: PAINT_ZONES - 1 }, (_, zone) => hueOf(zone)),
    map: saved ? saved.map.map((r) => r.slice()) : entry ? readMap(entry.map) : blankMap(),
  };
  el('sprite').value = real;
  el('alias').textContent = aliasOf ? `${key} shares ${aliasOf}'s paint` : '';
  paintUI();
}

// The working copy, remembered under its key, so switching tiles doesn't lose
// it and COPY EDITS can hand back the whole session at once.
function remember() {
  if (!work) return;
  if (zonesUsed(work.map) === 0 && !paintOf(work.key)) edits.delete(work.key);
  else edits.set(work.key, { hues: work.hues.slice(), map: work.map.map((r) => r.slice()) });
}

function drawGrid() {
  const canvas = el('grid');
  canvas.width = canvas.height = TILE * PX + 1;
  const c = canvas.getContext('2d');
  c.imageSmoothingEnabled = false;
  c.fillStyle = hex(palette.bg);
  c.fillRect(0, 0, canvas.width, canvas.height);
  const mask = (work && sprites[work.key]) || [];

  for (let y = 0; y < TILE; y++) {
    for (let x = 0; x < TILE; x++) {
      const ink = (mask[y] || '')[x] || '.';
      if (ink !== '.') {
        c.globalAlpha = ink === '+' ? FLOOR_TEXTURE_LEVEL : 1;
        c.fillStyle = hex(zoneInk(zoneAt(work.map, x, y)));
        c.fillRect(x * PX, y * PX, PX, PX);
        c.globalAlpha = 1;
      }
      c.strokeStyle = hex(palette.fg);
      c.globalAlpha = ink === '.' ? 0.12 : 0.25;
      c.strokeRect(x * PX + 0.5, y * PX + 0.5, PX, PX);
      c.globalAlpha = 1;
    }
  }
}

// The tile as the game will actually draw it, once for every number of gems a
// player can be carrying — which is the thing being designed: how much colour
// each gem brings back. Everything left of the gem a zone names is drawn in the
// base colour, so a tile should read as itself in the first of these and gain
// colour across the rest.
function drawSteps() {
  const host = el('steps');
  host.replaceChildren();
  const mask = (work && sprites[work.key]) || [];
  for (let gems = 0; gems < PAINT_ZONES; gems++) {
    const box = document.createElement('div');
    box.className = 'step';
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = TILE * STEP_PX;
    const c = canvas.getContext('2d');
    c.fillStyle = hex(palette.bg);
    c.fillRect(0, 0, canvas.width, canvas.height);
    for (let y = 0; y < TILE; y++)
      for (let x = 0; x < TILE; x++) {
        const ink = (mask[y] || '')[x] || '.';
        if (ink === '.') continue;
        c.globalAlpha = ink === '+' ? FLOOR_TEXTURE_LEVEL : 1;
        c.fillStyle = hex(zoneColour(zoneAt(work.map, x, y), gems));
        c.fillRect(x * STEP_PX, y * STEP_PX, STEP_PX, STEP_PX);
        c.globalAlpha = 1;
      }
    const caption = document.createElement('span');
    caption.textContent = gems === 0 ? 'no gems' : `${gems} gem${gems > 1 ? 's' : ''}`;
    box.append(canvas, caption);
    host.append(box);
  }
}

function drawZoneList() {
  const host = el('zones');
  host.replaceChildren();
  const counts = Array(PAINT_ZONES).fill(0);
  const mask = (work && sprites[work.key]) || [];
  for (let y = 0; y < TILE; y++)
    for (let x = 0; x < TILE; x++)
      if (((mask[y] || '')[x] || '.') !== '.') counts[zoneAt(work.map, x, y)]++;

  for (let zone = 0; zone < PAINT_ZONES; zone++) {
    const row = document.createElement('div');
    row.className = 'zone' + (zone === brush ? ' on' : '');
    const swatch = document.createElement('i');
    swatch.style.background = hex(zoneInk(zone));
    const name = document.createElement('b');
    name.textContent = zone === 0 ? 'BASE' : `ZONE ${zone}`;
    row.append(swatch, name);

    if (zone === 0) {
      const note = document.createElement('span');
      note.className = 'dim';
      note.textContent = 'whatever the tile would be anyway';
      row.append(note);
    } else {
      const select = document.createElement('select');
      for (const { hue, label } of HUES) select.add(new Option(label, String(hue)));
      select.value = String(work.hues[zone - 1]);
      select.addEventListener('change', () => {
        const raw = select.value;
        work.hues[zone - 1] = /^\d+$/.test(raw) ? Number(raw) : raw;
        remember();
        paintUI();
      });
      select.addEventListener('click', (e) => e.stopPropagation());
      row.append(select);
    }

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `${counts[zone]} px`;
    row.append(count);
    row.addEventListener('click', () => {
      brush = zone;
      paintUI();
    });
    host.append(row);
  }
}

// The entry as it goes into src/data/paint.js — the whole point of the page.
function entryText(key, { hues, map }) {
  const zones = zonesUsed(map);
  if (zones === 0) return `  // "${key}" paints no zones — leave it out of the table.`;
  const hueList = hues
    .slice(0, zones)
    .map((h) => (typeof h === 'string' ? `'${h}'` : String(h)))
    .join(', ');
  const rows = map
    .map((row) => `      '${row.map((zone) => ZONE_INK[zone]).join('')}',`)
    .join('\n');
  return `  '${key}': {\n    hues: [${hueList}],\n    map: [\n${rows}\n    ],\n  },`;
}

function paintUI() {
  el('painting').textContent = work ? work.key.toUpperCase() : '—';
  drawGrid();
  drawZoneList();
  drawSteps();
  el('out').textContent = work ? entryText(work.key, work) : '';
  el('copyEdits').disabled = edits.size === 0;
  el('copyEdits').textContent = `COPY EDITS (${edits.size})`;
  el('revert').disabled = !work || !edits.has(work.key);
}

function copy(text, said) {
  navigator.clipboard?.writeText(text).catch(() => {});
  el('status').textContent = said;
  setTimeout(() => (el('status').textContent = ''), 2000);
}

// Painting: a drag lays down the brush, a right-drag clears back to the base.
// Only pixels the sheet actually draws can be painted — a zone over nothing is
// nothing, and the map stays readable as art.
let stroke = null;
const gridPixel = (e) => {
  const r = el('grid').getBoundingClientRect();
  const x = Math.floor(((e.clientX - r.left) / r.width) * TILE);
  const y = Math.floor(((e.clientY - r.top) / r.height) * TILE);
  return x >= 0 && y >= 0 && x < TILE && y < TILE ? [x, y] : null;
};
const lay = (e) => {
  const at = gridPixel(e);
  if (!at || !work) return;
  const mask = sprites[work.key] || [];
  if (((mask[at[1]] || '')[at[0]] || '.') === '.') return;
  if (work.map[at[1]][at[0]] === stroke) return;
  work.map[at[1]][at[0]] = stroke;
  remember();
  paintUI();
};
el('grid').addEventListener('contextmenu', (e) => e.preventDefault());
el('grid').addEventListener('pointerdown', (e) => {
  stroke = e.button === 2 || e.shiftKey ? 0 : brush;
  el('grid').setPointerCapture(e.pointerId);
  lay(e);
});
el('grid').addEventListener('pointermove', (e) => stroke !== null && lay(e));
el('grid').addEventListener('pointerup', () => (stroke = null));
el('grid').addEventListener('pointercancel', () => (stroke = null));

el('clear').addEventListener('click', () => {
  work.map = blankMap();
  remember();
  paintUI();
});
el('revert').addEventListener('click', () => {
  edits.delete(work.key);
  loadSprite(work.key, { keepEdit: false });
});
el('copyEntry').addEventListener('click', () => copy(entryText(work.key, work), 'entry copied'));
el('copyEdits').addEventListener('click', () =>
  copy(
    [...edits.entries()].map(([key, entry]) => entryText(key, entry)).join('\n'),
    `${edits.size} entr${edits.size === 1 ? 'y' : 'ies'} copied`
  )
);
el('sprite').addEventListener('change', () => loadSprite(el('sprite').value));
for (const id of ['placeGem', 'openedBy']) {
  const select = el(id);
  for (let gem = 0; gem < PAINT_ZONES; gem++)
    select.add(new Option(gem === 0 ? 'no gem' : `gem ${gem}`, String(gem)));
  select.value = '1';
  select.addEventListener('change', paintUI);
}

// --- The sheet ---------------------------------------------------------------

function draw() {
  const pitch = cellPitch();
  sheetEl.width = GUTTER.left + SHEET_COLS * pitch;
  sheetEl.height = GUTTER.top + SHEET_ROWS * pitch;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = hex(palette.bg);
  ctx.fillRect(0, 0, sheetEl.width, sheetEl.height);

  ctx.font = '9px monospace';
  ctx.textBaseline = 'middle';

  if (labelsBox.checked) {
    ctx.fillStyle = hex(palette.fg);
    ctx.globalAlpha = 0.55;
    ctx.textAlign = 'center';
    for (let col = 0; col < SHEET_COLS; col++)
      ctx.fillText(String(col), cellX(col) + (TILE * scale) / 2, GUTTER.top / 2);
    ctx.textAlign = 'right';
    for (let row = 0; row < SHEET_ROWS; row++)
      ctx.fillText(String(row), GUTTER.left - 6, cellY(row) + (TILE * scale) / 2);
    ctx.globalAlpha = 1;
  }

  for (let row = 0; row < SHEET_ROWS; row++) {
    for (let col = 0; col < SHEET_COLS; col++) {
      const x = cellX(col);
      const y = cellY(row);
      const size = TILE * scale;
      ctx.fillStyle = hex(palette.fg);
      ctx.globalAlpha = 0.07;
      ctx.fillRect(x, y, size, size);
      ctx.globalAlpha = 1;
      ctx.drawImage(tinted, col * STRIDE, row * STRIDE, TILE, TILE, x, y, size, size);

      const keys = claims.get(`${col},${row}`);
      if (keys) {
        // A tile with zones on it is boxed in the colour of the first gem its
        // paint names, so what is already painted reads off the sheet.
        const painted = keys.map(paintedHue).find((hue) => hue !== null);
        ctx.strokeStyle = hex(painted === undefined ? palette.fg : gemColour(painted));
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, size - 1, size - 1);
      }
      if (picked && picked[0] === col && picked[1] === row) {
        ctx.strokeStyle = hex(palette.fg);
        ctx.lineWidth = 2;
        ctx.strokeRect(x - 1, y - 1, size + 2, size + 2);
      }
    }
  }
}

// The gem a key's paint leads with, or null if it has no zones on it — what the
// sheet and the list below mark a painted tile with.
function paintedHue(key) {
  const entry = edits.get(key) || paintOf(key);
  if (!entry) return null;
  const hues = Array.isArray(entry.hues) ? entry.hues : [];
  const zones = entry.map && typeof entry.map[0] !== 'string' ? zonesUsed(entry.map) : hues.length;
  if (!zones) return null;
  const hue = hues[0];
  return typeof hue === 'number' ? hue : 1;
}

// Screen position -> tile, or null in a gutter or a gap between cells.
function tileAt(px, py) {
  const pitch = cellPitch();
  const col = Math.floor((px - GUTTER.left) / pitch);
  const row = Math.floor((py - GUTTER.top) / pitch);
  if (col < 0 || row < 0 || col >= SHEET_COLS || row >= SHEET_ROWS) return null;
  return [col, row];
}

function showIn(canvasId, coId, keyId, tile) {
  const pix = el(canvasId).getContext('2d');
  pix.imageSmoothingEnabled = false;
  pix.clearRect(0, 0, 64, 64);
  const co = el(coId);
  const key = el(keyId);
  if (!tile) {
    co.textContent = '—';
    key.textContent = '';
    return;
  }
  pix.drawImage(tinted, tile[0] * STRIDE, tile[1] * STRIDE, TILE, TILE, 0, 0, 64, 64);
  co.textContent = `${tile[0]}, ${tile[1]}`;
  const keys = claims.get(tile.join(','));
  key.textContent = keys ? keys.join(', ') : 'unused';
  key.className = keys ? 'key' : 'key dim';
}

sheetEl.addEventListener('mousemove', (e) => {
  const r = sheetEl.getBoundingClientRect();
  showIn('hoverPix', 'hoverCo', 'hoverKey', tileAt(e.clientX - r.left, e.clientY - r.top));
});

sheetEl.addEventListener('click', (e) => {
  const r = sheetEl.getBoundingClientRect();
  const tile = tileAt(e.clientX - r.left, e.clientY - r.top);
  if (!tile) return;
  picked = tile;
  showIn('pickPix', 'pickCo', 'pickKey', tile);
  // Best-effort: a page opened without a secure context has no clipboard, and
  // the coordinate is on screen either way.
  navigator.clipboard?.writeText(`[${tile[0]}, ${tile[1]}]`).catch(() => {});
  const keys = claims.get(tile.join(','));
  if (keys) loadSprite(keys[0]);
  draw();
});

// The table as it stands, so what the game currently draws is readable without
// hunting for the boxes on the sheet.
function listClaimed() {
  const host = el('claimed');
  host.replaceChildren();
  for (const [key, col, row] of entries) {
    const line = document.createElement('div');
    const pix = document.createElement('canvas');
    pix.width = pix.height = 32;
    const c = pix.getContext('2d');
    c.imageSmoothingEnabled = false;
    c.drawImage(tinted, col * STRIDE, row * STRIDE, TILE, TILE, 0, 0, 32, 32);
    const name = document.createElement('span');
    name.textContent = key;
    const hue = paintedHue(key);
    if (hue !== null) {
      name.className = 'painted';
      name.style.color = hex(gemColour(hue));
    }
    const co = document.createElement('span');
    co.className = 'co';
    co.textContent = `${col}, ${row}`;
    line.append(pix, name, co);
    line.addEventListener('click', () => {
      picked = [col, row];
      showIn('pickPix', 'pickCo', 'pickKey', picked);
      loadSprite(key);
      draw();
      window.scrollTo({ top: cellY(row), behavior: 'smooth' });
    });
    host.append(line);
  }
}

function repaint() {
  document.documentElement.style.setProperty('--bg', hex(palette.bg));
  document.documentElement.style.setProperty('--fg', hex(palette.fg));
  draw();
  listClaimed();
  showIn('pickPix', 'pickCo', 'pickKey', picked);
  paintUI();
}

paletteSel.addEventListener('change', () => {
  // The game reads its palette from the same place, so picking one here is
  // picking one there — which is the point: a zone has to read against the
  // background of whichever palette the player is in.
  setPalette(paletteSel.value);
  palette = getPalette();
  tinted = retint(source);
  repaint();
});
zoomSel.addEventListener('change', () => {
  scale = Number(zoomSel.value);
  draw();
});
labelsBox.addEventListener('change', draw);

const source = new Image();
source.src = SHEET_PATH;
await source.decode();
tinted = retint(source);
sprites = buildSprites(sheetReader(source));
const spriteSel = el('sprite');
for (const key of spriteKeys()) spriteSel.add(new Option(key, key));
loadSprite('wizard-down');
repaint();
</script>
</body>
</html>
