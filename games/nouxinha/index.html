<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nouxinha</title>
  <style>
    /* Phaser sizes the canvas to fit #game, so #game has to *be* the viewport.
       Centring the parent with flex instead leaves it shrink-to-fit, which is a
       size Phaser cannot fit into: on a portrait phone it scaled the canvas to
       the viewport height and let the width overflow, so the sides of the HUD
       ran off screen and the page panned sideways — which ate taps, because a
       touch the browser is still deciding might be a pan never becomes a click.
       A full-viewport parent plus Phaser's own autoCenter does the centring. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    #game canvas {
      display: block;
      /* No pan/zoom gesture to wait on: every touch is the game's immediately. */
      touch-action: none;
      /* Phaser's pixelArt:true keeps its own internal render crisp, but FIT
         scaling then stretches that canvas up to the device's CSS size, and
         without this the browser smooths that stretch — which blurs the
         1-bit tile masks on any screen where the scale factor isn't a clean
         integer. */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.min.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
